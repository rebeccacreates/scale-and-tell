<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Scale &amp; Tell · Thank you</title><link rel="icon" href="./icon-192.png">
<style>
:root{--p:#45205b;--d:#2b1238;--g:#f6b93b;--bg:#fbf6fd;--t:#34213f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
.w{max-width:560px;margin:0 auto;padding:28px 18px 60px}.brand{display:flex;align-items:center;gap:10px;font:italic 800 22px Georgia,serif;color:var(--p);margin-bottom:22px}.brand img{width:40px;height:40px;border-radius:10px}
.card{background:#fff;border:1px solid #eadcf1;border-radius:22px;padding:26px 22px;box-shadow:0 14px 34px #45205b14}
h1{font:italic 800 30px/1.15 Georgia,serif;color:var(--p);margin:0 0 12px}ol,ul{padding-left:22px}li{margin:6px 0}
.btn{display:block;text-align:center;background:var(--p);color:#fff;font-weight:800;text-decoration:none;padding:15px 18px;border-radius:14px;margin:14px 0;border:0;font-size:17px;width:100%;cursor:pointer}
.btn.gold{background:var(--g);color:var(--d)}.sub{color:#6b5a75;font-size:15px}
textarea{width:100%;min-height:120px;border:2px solid #e3d4ea;border-radius:14px;padding:12px;font:inherit;margin-top:6px}
.hide{display:none}.ok{background:#eef8ee;border-radius:12px;padding:12px 14px;color:#245c2a;font-weight:700}
</style></head><body><div class="w">
<div class="brand"><img src="./icon-192.png" alt="">Scale &amp; Tell</div>
<div class="card" id="box"></div>
<p class="sub" style="text-align:center;margin-top:18px">Questions? Email <a href="mailto:support@scaleandtell.app">support@scaleandtell.app</a> 💜</p>
</div>
<script>
(function(){
var q=new URLSearchParams(location.search),r=q.get('r')||'',c=(q.get('c')||'').replace(/[^0-9a-f-]/gi,''),s=(q.get('s')||'').replace(/[^0-9a-f-]/gi,'');
var FN='https://fitlubsbesadknkjimqd.supabase.co/functions/v1/checkout-nudge';
var app='<a class="btn" href="https://scaleandtell.app/">Open Scale &amp; Tell →</a>';
var setup=s?'<a class="btn gold" href="./setup?t='+s+'">Set it up for me, free →</a>':'';
var steps='<ol><li>Open the app and add your first animal. A name and species is enough.</li><li>On feed night, tap <b>Feed Day</b>, then <b>Ate</b>.</li><li>That’s it! Next time you’ll know exactly who ate and when.</li></ol>';
var note=function(ph){return c?'<form id="nf"><textarea id="nt" maxlength="2000" placeholder="'+ph+'"></textarea><button class="btn" type="submit">Send to Rebecca →</button><p class="sub" id="nm"></p></form><div id="nd" class="ok hide">Got it, thank you! I’ll read it myself and get back to you. 💜</div>':'';};
var P={
 time:['Totally get it 💜','<p>Thanks for telling me! Here’s the 2-minute start whenever you’re ready:</p>'+steps+app+(setup?'<p><b>Rather I do it for you?</b> Fill out a quick form (or upload a photo of your notebook) and I’ll set up your whole collection, free.</p>'+setup:'')],
 start:['Let me make it easy 💜',(setup?'<p>The easiest way: tell me about your animals and <b>I’ll set up your whole account for you, free</b>. Short on time? Just upload a photo of your notebook or spreadsheet.</p>'+setup:'')+'<p>Or do it yourself in about 2 minutes:</p>'+steps+app],
 broken:['I’m so sorry! What happened?','<p>Tell me what went wrong (what you tapped, what you saw, which phone) and I’ll fix it.</p>'+note('For example: I tapped Sign in and nothing happened…')+'<p class="sub">Want to try again in the meantime?</p>'+app],
 looking:['No problem at all 💜','<p>Here’s what keepers use most once they add their animals:</p><ul><li>🍽 <b>Feed Day:</b> see who’s due tonight and log it in 3 taps</li><li>💌 <b>Sitter sheet:</b> one link with who eats what and when</li><li>🔮 <b>Shed predictions:</b> a heads-up before the next shed</li></ul>'+app+(setup?'<p>Want to see it with your own animals? I’ll set it up for you, free:</p>'+setup:'')],
 other:['Tell me more 💜','<p>I’d love to hear what got in the way. Anything helps.</p>'+note('Type anything…')+(setup?'<p>And if it helps, I’ll set up your account for you, free:</p>'+setup:'')]
};
var p=P[r]||['Thank you 💜','<p>Thanks for being part of Scale &amp; Tell!</p>'+app];
document.getElementById('box').innerHTML='<h1>'+p[0]+'</h1>'+p[1];
var f=document.getElementById('nf');
if(f)f.addEventListener('submit',async function(e){e.preventDefault();var t=document.getElementById('nt').value.trim(),m=document.getElementById('nm');if(!t){m.textContent='Please write a quick note first.';return;}m.textContent='Sending…';
 try{var res=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:c,note:t})});if(!res.ok)throw 0;f.classList.add('hide');document.getElementById('nd').classList.remove('hide');}catch(_){m.textContent='That didn’t send. Please email support@scaleandtell.app instead.';}});
})();
</script></body></html>
