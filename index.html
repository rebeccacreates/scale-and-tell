<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scale & Tell | Herps & Hers</title><style>:root{font-family:system-ui;background:#f7f5ef;color:#344b3c}body{margin:0}header{background:#45634f;color:white;padding:24px}main{max-width:650px;margin:auto;padding:18px}.card{background:white;border:1px solid #e1e5db;border-radius:15px;padding:16px;margin:12px 0}button{background:#45634f;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}input,select,textarea{padding:10px;border:1px solid #cbd5c7;border-radius:8px;box-sizing:border-box;width:100%;margin:5px 0 12px}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{background:#dfe8d8;color:#344b3c}.muted{color:#68786c;font-size:14px}.pill{color:#a4654c}h1{margin:0}h2{font-size:20px}label{display:block;font-weight:600;font-size:14px}small{display:block;margin-top:8px}</style></head><body><header><h1>🌿 Scale & Tell</h1><div>by Herps & Hers · Every scale. Every shed. Every milestone.</div></header><main><nav><button onclick="view='home';render()">Dashboard</button><button onclick="view='animals';render()">Animals</button><button onclick="view='logs';render()">Care journal</button><button onclick="view='reminders';render()">Reminders</button></nav><div id="app"></div><small class="muted">Beta demo: information is saved only in this browser on this device. Reminders are in-app previews, not push notifications. Do not enter sensitive information.</small></main><script>const initial=[{id:1,name:'Oro',species:'Ball Python',morph:'Enchi (store label)',sex:'Male'},{id:2,name:'Kane',species:'Ball Python',morph:'Unknown',sex:'Pending DNA'},{id:3,name:'Roux',species:'Corn Snake',morph:'Unconfirmed',sex:'Pending DNA'}];let animals=JSON.parse(localStorage.getItem('st_animals')||'null')||initial,logs=JSON.parse(localStorage.getItem('st_logs')||'[]'),reminders=JSON.parse(localStorage.getItem('st_reminders')||'[]'),view='home';const el=document.getElementById('app');function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('st_animals',JSON.stringify(animals));localStorage.setItem('st_logs',JSON.stringify(logs));localStorage.setItem('st_reminders',JSON.stringify(reminders))}function opts(){return animals.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}function render(){let s='';if(view==='home')s=`<h2>Your little ecosystem</h2><div class="card">🐍 ${animals.length} reptiles &nbsp; 📖 ${logs.length} care records &nbsp; 🔔 ${reminders.length} reminders</div><h2>Your collection</h2>`+animals.map(a=>`<div class="card"><strong>🐍 ${esc(a.name)}</strong><div class="muted">${esc(a.species)} · ${esc(a.morph)} · ${esc(a.sex)}</div></div>`).join('')+`<h2>Upcoming reminders</h2>`+(reminders.map(r=>`<div class="card">🔔 ${esc(r.title)} · ${esc(r.frequency)} at ${esc(r.time)}</div>`).join('')||'<p class="muted">No reminders yet.</p>');if(view==='animals')s=`<h2>My collection</h2>`+animals.map(a=>`<div class="card"><strong>${esc(a.name)}</strong><p>${esc(a.species)} · ${esc(a.morph)} · ${esc(a.sex)}</p></div>`).join('')+`<div class="card"><h2>Add reptile</h2><form id="animal"><label>Name</label><input name="name" required maxlength="60"><label>Species</label><input name="species" required maxlength="80"><label>Morph</label><input name="morph" maxlength="80"><label>Sex</label><select name="sex"><option>Unknown</option><option>Male</option><option>Female</option><option>Pending DNA</option></select><button>Add animal</button></form></div>`;if(view==='logs')s=`<h2>Care journal</h2><div class="card"><form id="log"><label>Animal</label><select name="pet">${opts()}</select><label>Activity</label><select name="type">${['Feeding','Shed','Weight','Handling','Temperature','Humidity','Cleaning','Bowel movement','Health','Other'].map(x=>`<option>${x}</option>`).join('')}</select><label>Date</label><input type="date" name="date" required value="${new Date().toLocaleDateString('en-CA')}"><label>Notes</label><textarea name="notes" maxlength="2000"></textarea><button>Save record</button></form></div>`+logs.slice().reverse().map(l=>`<div class="card"><strong>${esc(l.type)}</strong> · ${esc(animals.find(a=>a.id===l.pet)?.name||'Animal')}<div class="muted">${esc(l.date)}</div><p>${esc(l.notes)}</p></div>`).join('');if(view==='reminders')s=`<h2>Keeper alerts</h2><p class="muted">Configure a reminder preview. This version does not send notifications.</p><div class="card"><form id="reminder"><label>Animal</label><select name="pet">${opts()}</select><label>Reminder</label><select name="title">${['Feeding night','Substrate change','Spot cleaning','Water refresh','Weight check','Temperature check','Humidity check','UVB replacement','Custom reminder'].map(x=>`<option>${x}</option>`).join('')}</select><label>Repeat</label><select name="frequency"><option>Daily</option><option>Weekly</option><option>Every 2 weeks</option><option>Monthly</option><option>One time</option></select><label>Time</label><input type="time" name="time" value="19:00" required><button>Save reminder</button></form></div>`+reminders.map((r,i)=>`<div class="card"><strong>🔔 ${esc(animals.find(a=>a.id===r.pet)?.name)}: ${esc(r.title)}</strong><p>${esc(r.frequency)} · ${esc(r.time)}</p><button onclick="reminders.splice(${i},1);save();render()">Remove</button></div>`).join('');el.innerHTML=s;let form=el.querySelector('form');if(form)form.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));if(view==='animals')animals.push({...d,id:Math.max(0,...animals.map(a=>a.id))+1});if(view==='logs')logs.push({...d,pet:Number(d.pet)});if(view==='reminders')reminders.push({...d,pet:Number(d.pet)});save();render()}}render();</script></body></html>
